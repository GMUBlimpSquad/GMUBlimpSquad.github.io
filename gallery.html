    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              gmu: {
                green: '#006633',
                gold: '#FFCC33',
              },
              'dark-gray': '#1f2937',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
            animation: {
              fadeInUp: 'fadeInUp 0.8s ease-out forwards',
            },
            textShadow: {
              md: '0 2px 4px rgba(0,0,0,0.4)',
            }
          }
        }
      }
    </script>
    <style>
        .placeholder-block {
            background-color: #e2e8f0; border: 1px dashed #94a3b8; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center; color: #475569;
            font-size: 0.9rem; min-height: 150px; padding: 1rem;
        }
        .video-placeholder {
            position: relative; background-color: #374151; color: #d1d5db; border: none;
        }
        .video-placeholder::after {
            content: '▶'; font-size: 3rem; color: rgba(255, 255, 255, 0.7); position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        i.fas, i.fab, i.far { margin-right: 0.4em; vertical-align: -0.05em; }

        section {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }
        main > section:nth-child(1) { animation-delay: 0s; }
        main > section:nth-child(2) { animation-delay: 0.1s; }
        main > section:nth-child(3) { animation-delay: 0.15s; }
        main > section:nth-child(4) { animation-delay: 0.2s; }
        main > section:nth-child(5) { animation-delay: 0.25s; }
        main > section:nth-child(6) { animation-delay: 0.3s; }
        main > section:nth-child(7) { animation-delay: 0.35s; }


        .schedule-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid #d1d5db; }
        .schedule-day { border-left: 1px solid #d1d5db; }
        .schedule-day:first-child { border-left: none; }
        .schedule-header { background-color: #f3f4f6; padding: 0.75rem; text-align: center; font-weight: 600; border-bottom: 1px solid #d1d5db; font-size: 0.9rem; }
        .schedule-time-slot { padding: 1rem; border-top: 1px solid #e5e7eb; min-height: 130px; display: flex; flex-direction: column; justify-content: flex-start; font-size: 0.8rem; }
        .schedule-game, .schedule-event, .schedule-practice {
            border-radius: 4px; padding: 0.75rem; margin-top: 0.75rem; font-size: 0.75rem; line-height: 1.4;
        }
        .schedule-game { background-color: #fef9c3; border: 1px solid #fde68a; }
        .schedule-event { background-color: #e0f2fe; border: 1px solid #bae6fd; }
        .schedule-practice { background-color: #e5e7eb; border: 1px solid #d1d5db; }
        .team-logo-sched { width: 1rem; height: 1rem; border-radius: 50%; display: inline-block; margin-right: 0.25rem; vertical-align: middle; background-color: #cbd5e1; }
        .team-blue { color: #2563eb; }
        .team-red { color: #dc2626; }
         .text-shadow-md { text-shadow: 0 2px 4px rgba(0,0,0,0.4); }


    </style>
