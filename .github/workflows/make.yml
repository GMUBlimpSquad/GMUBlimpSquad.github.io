# Workflow name
name: Deploy Static Website to GitHub Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push events but only for the main branch
  push:
    branches: ["main"] # Change this to your default branch if it's not "main"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Define the deployment job
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # Output the deployment URL
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Checks out your repository code

      - name: Setup Pages
        uses: actions/configure-pages@v4 # Configures GitHub Pages settings

      # --- Optional Build Step ---
      # If you had a build process (e.g., for processing Tailwind, JS frameworks)
      # you would add steps here to install dependencies and run the build.
      # Example for Node.js/npm:
      # - name: Use Node.js
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20' # Specify your Node version
      #     cache: 'npm'
      # - name: Install dependencies
      #   run: npm ci
      # - name: Build static site
      #   run: npm run build # Or your specific build command
      # --------------------------

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Uploads site files for deployment
        with:
          # Upload everything from the root directory.
          # If your built site is in a specific folder (e.g., 'dist', 'build', '_site'),
          # change './' to that folder name (e.g., './dist').
          path: './'

      - name: Deploy to GitHub Pages
        id: deployment # Give the step an ID to reference its outputs
        uses: actions/deploy-pages@v4 # Deploys the artifact to GitHub Pages

